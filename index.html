<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Prompt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .prompt-card { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        .loader-dots div {
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
        }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">PromptStack</h1>
                    <p class="text-xs text-gray-400">Stock Photography Prompt Generator</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-grow md:w-80">
                    <input type="password" id="apiKey" placeholder="Enter Groq API Key" 
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                </div>
                <button onclick="saveKey()" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-lg border border-gray-700 transition-colors" title="Save Key">
                    <i class="fa-solid fa-floppy-disk text-gray-300"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-4 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-gray-900 rounded-xl p-6 border border-gray-800 shadow-xl">
                    <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-blue-500"></i> Settings
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Target Quantity</label>
                            <input type="number" id="targetCount" value="10" min="1"
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Delay (Seconds)</label>
                            <input type="number" id="delaySeconds" value="5" min="1"
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Groq Model</label>
                            <select id="modelSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:border-blue-500 outline-none appearance-none">
                                <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                                <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-8 space-y-3">
                        <button id="startBtn" onclick="handleStart()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-all shadow-lg">
                            <i class="fa-solid fa-play"></i> Start Generating
                        </button>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <button id="pauseBtn" onclick="handlePause()" disabled class="bg-gray-800 hover:bg-gray-700 disabled:opacity-50 text-white py-2 rounded-lg border border-gray-700 transition-all">
                                <i class="fa-solid fa-pause mr-1"></i> Pause
                            </button>
                            <button id="stopBtn" onclick="handleStop()" disabled class="bg-red-900/30 hover:bg-red-900/50 disabled:opacity-50 text-red-400 py-2 rounded-lg border border-red-900/50 transition-all">
                                <i class="fa-solid fa-stop mr-1"></i> Stop
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-900 rounded-xl p-6 border border-gray-800">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-sm font-semibold text-gray-300">Statistics</h2>
                        <span id="statusIndicator" class="text-[10px] px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700 italic">Idle</span>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Generated:</span>
                            <span id="currentCount" class="font-mono font-bold text-blue-400">0</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-1.5 overflow-hidden">
                            <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
                        </div>
                        <button id="downloadBtn" onclick="downloadExcel()" disabled class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-sm font-semibold py-2 rounded-lg transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-excel"></i> Export to .XLSX
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="lg:col-span-8 flex flex-col h-[calc(100vh-180px)]">
                <div class="flex items-center justify-between mb-4 px-2">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> Prompt Stack
                    </h2>
                    <button onclick="clearPrompts()" class="text-xs text-gray-500 hover:text-red-400 transition-colors">
                        <i class="fa-solid fa-trash-can mr-1"></i> Clear All
                    </button>
                </div>
                
                <div id="promptContainer" class="flex-grow bg-gray-900 rounded-xl border border-gray-800 p-4 overflow-y-auto space-y-4">
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-600">
                        <i class="fa-solid fa-terminal text-4xl mb-4 opacity-20"></i>
                        <p class="text-sm italic">Waiting to generate stock prompts...</p>
                    </div>
                </div>
                
                <div id="activeLoader" class="hidden mt-4 bg-gray-800/50 border border-blue-500/30 rounded-xl p-4">
                    <div class="flex items-center gap-4">
                        <div class="relative w-16 h-8 flex items-center loader-dots">
                            <div class="absolute w-3 h-3 bg-blue-500 rounded-full"></div>
                            <div class="absolute w-3 h-3 bg-blue-500 rounded-full"></div>
                            <div class="absolute w-3 h-3 bg-blue-500 rounded-full"></div>
                            <div class="absolute w-3 h-3 bg-blue-500 rounded-full"></div>
                        </div>
                        <p class="text-sm text-blue-300 font-medium animate-pulse" id="loaderText">Thinking...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-950 border-t border-gray-900 p-4 text-center">
        <p class="text-xs text-gray-600">Designed for stock contributors. Strictly No Faces.</p>
    </footer>

    <div id="toast" class="fixed bottom-8 right-8 bg-gray-800 border border-gray-700 text-white px-6 py-3 rounded-xl shadow-2xl translate-y-20 transition-all duration-300 opacity-0 z-[100] flex items-center gap-3">
        <i id="toastIcon" class="fa-solid fa-circle-check text-green-500"></i>
        <span id="toastMsg" class="text-sm font-medium">Message here</span>
    </div>

    <script>
        let prompts = [];
        let isProcessing = false;
        let isPaused = false;
        let stopRequested = false;

        // General Themes
        const THEMES = [
            "Business", "Technology", "Medical", "Education", "Ecology", 
            "Industrial", "Sport", "Fitness", "Culinary", "Fashion", 
            "Architecture", "Science", "Logistics", "Construction", 
            "Travel", "Lifestyle", "Wellness", "Arts", "Automotive",
            "Finance", "Agriculture", "Infrastructure", "E-commerce"
        ];

        const LIGHTING = [
            "Golden Hour (warm natural light)",
            "Soft Studio Lighting",
            "Dramatic High-Contrast",
            "Moody Cinematic Dark",
            "Bright & Airy Natural Light",
            "Neon Night / Cyberpunk glow",
            "Overcast Softbox",
            "Backlit Rim Lighting",
            "Warm Candlelight",
            "Cool Fluorescent / Sterile"
        ];

        const COMPOSITIONS = [
            "Wide Angle",
            "Extreme Close-up / Macro",
            "Low Angle Looking Up",
            "Flat Lay / Top Down",
            "Symmetric",
            "Rule of Thirds",
            "Minimalist Negative Space",
            "Over-the-shoulder perspective",
            "Frame-within-a-frame",
            "Diagonal Leading Lines"
        ];

        const SYSTEM_PROMPT = `You are a world-class AI prompt engineer specialized in commercial stock photography. 
Your task is to generate a highly detailed, realistic, and commercially viable image generation prompt based on a general theme.
CRITICAL RULE: DO NOT include human or animal faces. Use techniques like silhouettes, focusing on hands, back views, or purely environmental shots to ensure commercial anonymity.
Output ONLY the prompt text. No explanations, no headers, no quotation marks.`;

        const apiKeyInput = document.getElementById('apiKey');
        const targetInput = document.getElementById('targetCount');
        const delayInput = document.getElementById('delaySeconds');
        const modelSelect = document.getElementById('modelSelect');
        const promptContainer = document.getElementById('promptContainer');
        const emptyState = document.getElementById('emptyState');
        const currentCountEl = document.getElementById('currentCount');
        const progressBar = document.getElementById('progressBar');
        const activeLoader = document.getElementById('activeLoader');
        const loaderText = document.getElementById('loaderText');
        const statusIndicator = document.getElementById('statusIndicator');

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        window.onload = () => {
            const savedKey = localStorage.getItem('groq_api_key_prompts');
            if (savedKey) apiKeyInput.value = savedKey;
        };

        function saveKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('groq_api_key_prompts', key);
                showToast("API Key saved locally", "success");
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            icon.className = type === "success" ? "fa-solid fa-circle-check text-green-500" : "fa-solid fa-triangle-exclamation text-red-500";
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function updateProgress() {
            const target = parseInt(targetInput.value);
            const current = prompts.length;
            currentCountEl.textContent = current;
            const percentage = Math.min((current / target) * 100, 100);
            progressBar.style.width = `${percentage}%`;
            downloadBtn.disabled = prompts.length === 0;
        }

        function addPromptToUI(text) {
            emptyState.classList.add('hidden');
            const card = document.createElement('div');
            card.className = "prompt-card bg-gray-800 border border-gray-700 p-4 rounded-xl hover:border-blue-500/50 transition-all group relative";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[10px] font-mono text-gray-500">#${prompts.length}</span>
                    <button onclick="copyText(this)" class="text-gray-500 hover:text-white transition-colors">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-200 leading-relaxed">${text}</p>
            `;
            promptContainer.prepend(card);
        }

        function copyText(btn) {
            const text = btn.closest('.prompt-card').querySelector('p').textContent;
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('i');
            icon.className = "fa-solid fa-check text-green-500";
            setTimeout(() => icon.className = "fa-regular fa-copy", 2000);
        }

        function clearPrompts() {
            if (isProcessing) return;
            prompts = [];
            promptContainer.innerHTML = '';
            promptContainer.appendChild(emptyState);
            emptyState.classList.remove('hidden');
            updateProgress();
        }

        async function handleStart() {
            const key = apiKeyInput.value.trim();
            if (!key) return showToast("Please enter an API Key", "error");
            isProcessing = true;
            isPaused = false;
            stopRequested = false;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            statusIndicator.textContent = "Running";
            statusIndicator.className = "text-[10px] px-2 py-0.5 rounded-full bg-blue-900/30 text-blue-400 border border-blue-800 italic";
            generateLoop();
        }

        function handlePause() {
            isPaused = !isPaused;
            pauseBtn.innerHTML = isPaused ? '<i class="fa-solid fa-play mr-1"></i> Resume' : '<i class="fa-solid fa-pause mr-1"></i> Pause';
            statusIndicator.textContent = isPaused ? "Paused" : "Running";
        }

        function handleStop() {
            stopRequested = true;
            statusIndicator.textContent = "Stopping...";
        }

        async function generateLoop() {
            const target = parseInt(targetInput.value);
            const delayMs = parseInt(delayInput.value) * 1000;
            const model = modelSelect.value;
            const key = apiKeyInput.value.trim();

            while (prompts.length < target && !stopRequested) {
                if (isPaused) {
                    await new Promise(r => setTimeout(r, 500));
                    continue;
                }

                activeLoader.classList.remove('hidden');
                loaderText.textContent = `Generating prompt ${prompts.length + 1}...`;

                try {
                    const result = await callGroq(key, model);
                    if (result) {
                        prompts.push(result);
                        addPromptToUI(result);
                        updateProgress();
                    }
                } catch (err) {
                    showToast(err.message, "error");
                    break;
                }

                activeLoader.classList.add('hidden');

                if (prompts.length < target && !stopRequested) {
                    let remaining = delayMs;
                    while (remaining > 0 && !stopRequested && !isPaused) {
                        loaderText.textContent = `Delaying... ${Math.ceil(remaining/1000)}s`;
                        activeLoader.classList.remove('hidden');
                        await new Promise(r => setTimeout(r, 1000));
                        remaining -= 1000;
                    }
                    activeLoader.classList.add('hidden');
                }
            }
            finishProcessing();
        }

        function finishProcessing() {
            isProcessing = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            activeLoader.classList.add('hidden');
            statusIndicator.textContent = "Idle";
            if (prompts.length >= parseInt(targetInput.value)) showToast("Target reached!", "success");
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        async function callGroq(key, model) {
            const theme = getRandomItem(THEMES);
            const lighting = getRandomItem(LIGHTING);
            const composition = getRandomItem(COMPOSITIONS);

            const userPrompt = `Generate a unique, high-quality stock photography prompt for the theme: ${theme}.
            Use the following technical requirements:
            Lighting: ${lighting}
            Composition: ${composition}
            
            IMPORTANT: Invent a specific, commercially viable scenario for this theme. 
            Ensure the scene is anonymous (strictly NO faces). 
            Use silhouettes, hands, over-the-shoulder perspectives, or environmental details.`;

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 1.0, 
                    max_tokens: 350
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || "API Error");
            }

            const data = await response.json();
            return data.choices[0].message.content.trim();
        }

        function downloadExcel() {
            if (prompts.length === 0) return;
            const data = prompts.map(p => [p]);
            const worksheet = XLSX.utils.aoa_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Prompts");
            XLSX.writeFile(workbook, `stock_prompts_${new Date().toISOString().slice(0, 10)}.xlsx`);
            showToast("Excel file downloaded");
        }
    </script>
</body>
</html>
